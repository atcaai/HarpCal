name: Update Harpenden calendar

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install -r requirements.txt
      - run: python scraper.py

      - name: Commit updated feed
        run: |
          git config user.name "harpenden-calendar-bot"
          git config user.email "harpenden-calendar-bot@users.noreply.github.com"
          git add events.ics
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
