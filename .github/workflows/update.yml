name: Update Harpenden calendar

on:
  schedule:
    # Runs once daily at 18:00 UTC (6:00 PM)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated feed
        run: |
          git config user.name "harpenden-calendar-bot"
          git config user.email "harpenden-calendar-bot@users.noreply.github.com"
          git add events.ics
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
