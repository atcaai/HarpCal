name: Update Harpenden calendar

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install -r requirements.txt
      - run: python scraper_htc.py

      #Commit the calendar to the repo
      - name: Commit and push updated feed
        run: |
          git config user.name "harpenden-calendar-bot"
          git config user.email "harpenden-calendar-bot@users.noreply.github.com"
          git add events_htc.ics
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
          
      # Create an isolated publish folder with only events.ics
      - name: Stage output file
        run: |
          mkdir -p public
          cp events_htc.ics public/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
